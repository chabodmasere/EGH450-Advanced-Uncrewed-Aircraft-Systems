<line class="g" x1="492" x2="832" y1="172.0" y2="172.0" stroke-width="1"/><text class="m" x="484" y="176.0" font-size="12" text-anchor="end">10</text>
<line class="g" x1="492" x2="832" y1="117.0" y2="117.0" stroke-width="1"/><text class="m" x="484" y="121.0" font-size="12" text-anchor="end">15</text>
<line class="g" x1="492" x2="832" y1="62.0" y2="62.0" stroke-width="1"/><text class="m" x="484" y="66.0" font-size="12" text-anchor="end">20</text>
