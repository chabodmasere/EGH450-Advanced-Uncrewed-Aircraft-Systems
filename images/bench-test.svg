<polyline class="l" points="62.0,271.0 147.0,242.4 232.0,200.6 317.0,147.8 402.0,95.0" fill="none" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<circle class="d" cx="62.0" cy="271.0" r="5" stroke-width="2"/>
<text class="t" x="62.0" y="259.0" font-size="13" font-weight="600" text-anchor="start">0.05</text>
<circle class="d" cx="147.0" cy="242.4" r="5" stroke-width="2"/>
<circle class="d" cx="232.0" cy="200.6" r="5" stroke-width="2"/>
<circle class="d" cx="317.0" cy="147.8" r="5" stroke-width="2"/>
<circle class="d" cx="402.0" cy="95.0" r="5" stroke-width="2"/>
<text class="t" x="402.0" y="83.0" font-size="13" font-weight="600" text-anchor="end">0.85</text>
<text class="t" x="492" y="28" font-size="17" font-weight="600">Efficiency</text><text class="m" x="492" y="47" font-size="13">gf/W, average of three sweeps</text>
